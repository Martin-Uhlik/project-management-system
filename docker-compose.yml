# The whole system, built from this folder:  docker compose up -d --build
# Only the database (for npm run dev on this machine):  docker compose up -d database
# Working on the code with live reload, all in Docker: docker-compose.dev.yml
# Settings come from .env next to this file (cp .env.example .env); each service gets only what it needs.
services:
    frontend:
        container_name: project-management-system-frontend
        build:
            context: ./frontend
            args:
                # the API address the browser uses, baked into the build
                VITE_BACKEND: ${VITE_BACKEND}
        restart: always
        ports:
            - 80:80
        depends_on:
            - backend

    # Runs once on every start, then exits: applies new migrations (backend/prisma/migrations) and fills an empty
    # database (src/seed.ts): the first admin account (ADMIN_LOGIN / ADMIN_PASSWORD from .env, change the password!)
    # and, with SEED_DEMO_DATA=true in .env, example data. The backend starts when it has finished.
    migrate:
        container_name: project-management-system-migrate
        build: ./backend
        image: project-management-system-backend
        command: sh -c "npx prisma migrate deploy && node dist/seed.js"
        environment:
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
            ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
            SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
        depends_on:
            database:
                condition: service_healthy

    backend:
        container_name: project-management-system-backend
        build: ./backend
        image: project-management-system-backend
        # the migrations already ran in "migrate"
        command: node dist/index.js
        restart: always
        ports:
            - ${BACKEND_PORT:-4000}:4000
        environment:
            BACKEND_PORT: 4000
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
        volumes:
            # uploaded task files; the container runs as uid 1000 (node), so the folder must be writable for it
            - type: bind
              source: ./backend/data
              target: /app/data
        depends_on:
            migrate:
                condition: service_completed_successfully

    database:
        container_name: project-management-system-db
        image: postgres:18-alpine
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            PGDATA: /app/database_data/pgdata
        ports:
            # for npm run dev and database tools on this machine only; never open it to the network
            - '127.0.0.1:${DB_PORT:-5432}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - type: bind
              source: ./database/data
              target: /app/database_data
