services:
    frontend:
        build: ./frontend
        restart: always
        ports:
            - 80:80
        env_file:
            - ./frontend/.env
        depends_on:
            - backend

    backend:
        build: ./backend
        restart: always
        ports:
            - 4000:4000
        env_file:
            - ./backend/.env
        volumes:
            - type: bind
              source: ./backend/data
              target: /app/data
        depends_on:
            database:
                condition: service_healthy

    database:
        image: postgres:18-alpine
        restart: always
        # ports:
        #   - 5432:5432
        env_file:
            - ./database/.env
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - type: bind
              source: ./database/data
              target: /app/database_data

