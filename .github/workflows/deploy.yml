name: Test, Build and Deploy

# Every push to main is tested, built into two images on Docker Hub and deployed to the demo at
# https://project-management-system.martin-uhlik.cz (server side: private-production-settings,
# apps/project-management-system). Pull requests are only tested.
on:
    push:
        branches:
            - main
    pull_request:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
    group: ${{ github.event_name == 'push' && 'deploy-production' || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    SITE_URL: https://project-management-system.martin-uhlik.cz

jobs:
    test:
        runs-on: ubuntu-latest
        # the API tests need a real PostgreSQL; they wipe it between tests
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: pms_test
                    POSTGRES_USER: pms
                    POSTGRES_PASSWORD: pms
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U pms -d pms_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgres://pms:pms@localhost:5432/pms_test
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: |
                      backend/package-lock.json
                      frontend/package-lock.json

            - name: Backend - install, lint, typecheck, test
              working-directory: backend
              run: |
                  npm ci
                  npm run lint
                  npm run typecheck
                  npm test

            - name: Frontend - install, lint, test, build
              working-directory: frontend
              run: |
                  npm ci
                  npm run lint
                  npm test
                  npm run build

    build:
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # Pushes :latest (what the server runs) plus a commit-SHA tag to roll back to, for each image.
            # The frontend calls the API on its own address under /api (its nginx passes it on to the backend), so
            # the image isn't tied to a domain. The backend image also runs the migrations and the seed on the server.
            - name: Build and push Docker images
              run: |
                  FRONTEND=${{ secrets.DOCKER_USERNAME }}/project-management-system-frontend
                  BACKEND=${{ secrets.DOCKER_USERNAME }}/project-management-system-backend
                  docker build --build-arg VITE_BACKEND=/api -t "$FRONTEND:latest" -t "$FRONTEND:${{ github.sha }}" frontend
                  docker build -t "$BACKEND:latest" -t "$BACKEND:${{ github.sha }}" backend
                  docker push "$FRONTEND:latest"
                  docker push "$FRONTEND:${{ github.sha }}"
                  docker push "$BACKEND:latest"
                  docker push "$BACKEND:${{ github.sha }}"

    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push'
        steps:
            # The key in VPS_SSH_KEY is restricted on the server (authorized_keys command="...") so it can only run
            # apps/project-management-system/deploy.sh. See private-production-settings/README.md.
            - name: Configure SSH
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts

            - name: Deploy on VPS
              run: |
                  ssh -i ~/.ssh/deploy_key \
                      -o StrictHostKeyChecking=yes \
                      -o BatchMode=yes \
                      "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

            # the site loads, and the API answers through both proxies (401: reachable, just not signed in)
            - name: Check the demo is up
              run: |
                  curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$SITE_URL/"
                  for attempt in 1 2 3 4 5 6; do
                      status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/auth/me" || true)
                      [ "$status" = "401" ] && exit 0
                      echo "API answered $status, waiting"
                      sleep 5
                  done
                  echo "The API didn't answer 401 on $SITE_URL/api/auth/me" >&2
                  exit 1

            - name: Remove SSH key
              if: always()
              run: rm -f ~/.ssh/deploy_key
