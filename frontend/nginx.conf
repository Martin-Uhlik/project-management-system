# The frontend's nginx: serves the built app and passes /api/ (REST and the live updates on /api/live) to the backend,
# so the browser talks to one address only (build the frontend with VITE_BACKEND=/api for that).
#
# A template: on start the nginx image fills in ${API_UPSTREAM} and ${MAX_UPLOAD_SIZE} from the environment
# (defaults in the Dockerfile) and writes the result to /etc/nginx/conf.d/default.conf.
#   API_UPSTREAM     the backend, e.g. http://project-management-system-backend:4000 (its container_name)
#   MAX_UPLOAD_SIZE  the largest request body, e.g. 5m; keep it in step with UPLOAD_LIMIT_MB of the backend

# WebSocket upgrades for the live updates; a plain request keeps "Connection: close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen       80;
    server_name  _;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # Docker's DNS. With the backend's address in a variable, nginx looks it up per request instead of at start, so
    # the site still loads while the backend is down (the API then answers 502 until it is back).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api ${API_UPSTREAM};
        # the backend's routes have no /api prefix (/login, /auth/..., /live); with a variable in proxy_pass the
        # prefix has to be removed here
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the outer proxy (if any) terminates TLS; pass on what it told us, or our own scheme
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        client_max_body_size ${MAX_UPLOAD_SIZE};
        # Socket.IO pings every 25 s, so an open live connection never idles this long
        proxy_read_timeout 60s;
    }

    # built files have a hash in their name: cache them for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # everything else is the single-page app; index.html is checked on every load so a new release shows at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
