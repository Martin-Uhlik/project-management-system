<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/images/favico-32x32.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="ADAM DESIGN project management system" />

        <title>ADAM DESIGN</title>
        <script>
            // the light or dark look and the text size before the app loads, so the page doesn't flash or jump
            // (same rules as components/ui/theme.js and useFontSize.js)
            try {
                var mode = localStorage.getItem('mui-mode') || 'system';
                if (mode === 'system') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', mode);
                // the text size (components/ui/useFontSize.js)
                var sizes = { small: '87.5%', medium: '100%', large: '112.5%' };
                var size = localStorage.getItem('font-size');
                if (sizes[size]) document.documentElement.style.fontSize = sizes[size];
            } catch (e) {}
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
